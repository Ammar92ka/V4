name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      # ملفات اللعبة تُحفظ قبل إنشاء مشروع أندرويد جديد، لأن flutter create قد يستبدل بعضها
      - name: حفظ ملفات اللعبة
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/lib
          cp -r test /tmp/src/test
          cp -r signing /tmp/src/signing
          cp -r tools /tmp/src/tools
          cp pubspec.yaml /tmp/src/pubspec.yaml
          cp analysis_options.yaml /tmp/src/analysis_options.yaml

      - name: إنشاء مشروع أندرويد جديد
        run: |
          rm -rf android
          flutter create . --platforms android --org com.ottoman.game --project-name ottoman_empire_1800

      - name: إرجاع ملفات اللعبة
        run: |
          rm -rf lib test signing tools
          cp -r /tmp/src/lib lib
          cp -r /tmp/src/test test
          cp -r /tmp/src/signing signing
          cp -r /tmp/src/tools tools
          cp /tmp/src/pubspec.yaml pubspec.yaml
          cp /tmp/src/analysis_options.yaml analysis_options.yaml

      # flutter create ينشئ AndroidManifest بدون صلاحية الإنترنت، وبدونها يفشل اتصال الذكاء الاصطناعي في نسخة الإصدار
      - name: صلاحية الإنترنت واسم التطبيق
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="الدولة العثمانية 1800"/' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          head -8 "$MANIFEST"

      # توقيع ثابت: بدونه يولد كل بناء مفتاحا جديدا فلا يتثبت التحديث فوق النسخة القديمة وتضيع اللعبة المحفوظة.
      # المفتاح الافتراضي في signing/ottoman.p12. لمفتاحك الخاص أضف أسرارا في المستودع:
      # KEYSTORE_BASE64 (ملف p12 بصيغة base64) وKEYSTORE_PASSWORD وKEY_ALIAS وKEY_PASSWORD.
      - name: مفتاح التوقيع من الأسرار (اختياري)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > signing/ottoman.p12; echo "استخدام مفتاح من الأسرار"; fi
      - name: ضبط التوقيع الثابت
        run: python3 tools/sign_android.py
        continue-on-error: true

      - run: flutter pub get

      # الأخطاء في التحليل توقف البناء؛ أما التحذيرات والملاحظات فلا. والاختبارات إلزامية.
      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: الاختبارات
        run: flutter test

      - name: بناء APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ottoman-apk
          path: build/app/outputs/flutter-apk/app-release.apk
